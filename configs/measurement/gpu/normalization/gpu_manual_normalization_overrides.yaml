- id: quadro_p5000_alias
  benchmark_gpu_name: NVIDIA Quadro P5000
  description: Explicit Quadro P5000 aliases with optional reported memory.
  patterns:
  - '^(?:nvidia )?(?:quadro )?p5000(?: \d+gb)?$'
- id: rtx_3090_alias
  benchmark_gpu_name: NVIDIA GeForce RTX 3090
  description: Explicit RTX 3090 aliases with reordered vendor or product-line tokens.
  patterns:
  - '^(?:nvidia )?rtx (?:nvidia |geforce )?3090(?: \d+gb)?$'
  - '^(?:nvidia )?geforce rtx 3090(?: \d+gb)?$'
  - ^rtx \d+gb 3090$
  - '^(?:nvidia )?quadro rtx 3090(?: \d+gb)?$'
- id: gtx_1060_alias
  benchmark_gpu_name: NVIDIA GeForce GTX 1060
