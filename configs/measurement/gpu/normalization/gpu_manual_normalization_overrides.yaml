manual_gpu_normalization_rules:
- id: quadro_p6000_alias
  benchmark_gpu_name: NVIDIA Quadro P6000
  description: Explicit P6000 model aliases with optional reported memory.
  patterns:
  - '^(?:nvidia )?(?:quadro )?p6000(?: \d+gb)?$'
- id: rtx_a4000_alias
  benchmark_gpu_name: NVIDIA RTX A4000
  description: Explicit RTX A4000 model aliases with optional reported memory.
  patterns:
  - '^(?:nvidia )?(?:geforce )?rtx a4000(?: \d+gb)?$'
  - '^(?:nvidia )?rtxa ?4000(?: \d+gb)?$'
- id: gtx_titan_alias
  benchmark_gpu_name: NVIDIA GeForce GTX TITAN
  description: Explicit GTX TITAN aliases, including OCR titan spelling variants normalized
    upstream.
  patterns:
  - '^(?:nvidia )?(?:geforce )?gtx titan(?: \d+gb)?$'
- id: gtx_titan_black_alias
  benchmark_gpu_name: NVIDIA GeForce GTX Titan Black
  description: Explicit GTX TITAN Black aliases with optional reported memory.
  patterns:
  - '^(?:nvidia )?(?:geforce )?gtx titan black(?: \d+gb)?$'
- id: titan_v_alias
  benchmark_gpu_name: NVIDIA Titan V
  description: Explicit TITAN V aliases including compact OCR forms.
  patterns:
  - ^(?:nvidia )?(?:geforce )?(?:gpu )?titan v$
  - ^(?:nvidia )?titanv$
- id: titan_xp_alias
  benchmark_gpu_name: NVIDIA TITAN Xp
  description: Explicit TITAN Xp aliases with optional reported memory.
  patterns:
  - '^(?:nvidia )?(?:geforce )?titan xp(?: \d+gb)?(?: gpu)?$'
- id: rtx_2080_super_alias
  benchmark_gpu_name: NVIDIA GeForce RTX 2080 SUPER
